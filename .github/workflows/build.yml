name: AppImage Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "**/LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  TZ: Asia/Seoul
  APPIMAGE_EXTRACT_AND_RUN: "1"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.filter.outputs.should_build }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files in each commit
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            mapfile -t commits < <(git rev-list "$BEFORE..$GITHUB_SHA")
          else
            commits=("$GITHUB_SHA")
          fi

          should_build=true
          for commit in "${commits[@]}"; do
            if git rev-parse "$commit^" >/dev/null 2>&1; then
              files=(git diff --name-only -z "$commit^" "$commit")
            else
              files=(git diff-tree --root --no-commit-id --name-only -r -z "$commit")
            fi
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|LICENSE|*/LICENSE|.github/workflows/*)
                  echo "Skipping build: $commit changes $path"
                  should_build=false
                  break
                  ;;
              esac
            done < <("${files[@]}")
            if [[ "$should_build" == false ]]; then
              break
            fi
          done
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    name: Build AppImage
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libimobiledevice-dev libimobiledevice-utils usbmuxd
      - name: Install AppImage tools
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimage-tools/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimage-tools/appimagetool" https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy" "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --locked
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-x86_64.AppImage
          path: dist/AirCard-x86_64.AppImage
          if-no-files-found: error
