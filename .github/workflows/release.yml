name: Release

on:
  workflow_run:
    workflows:
      - AppImage Build
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string
      build_run_id:
        description: "Successful AppImage Build run ID (optional; auto-detected by commit)"
        required: false
        type: string

env:
  TZ: Asia/Seoul

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    concurrency:
      group: aircard-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve tag and build run
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git fetch --tags --force
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_VERSION"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must be vX.Y.Z: $tag" >&2
              exit 1
            fi
            commit="$(git rev-parse "refs/tags/$tag^{commit}")"
            run_id="$REQUESTED_RUN_ID"
            if [[ -z "$run_id" ]]; then
              run_id="$(gh run list --workflow build.yml --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            fi
          else
            commit="$SOURCE_SHA"
            run_id="$SOURCE_RUN_ID"
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No valid successful AppImage Build run found for $tag" >&2
            exit 1
          fi
          run_info="$(gh run view "$run_id" --json headSha,conclusion,workflowName,jobs --jq '[.headSha,.conclusion,.workflowName, ([.jobs[] | select(.name == "Build AppImage") | .conclusion][0] // "")] | @tsv')"
          IFS=$'\t' read -r build_sha build_result build_name build_job_result <<< "$run_info"
          if [[ "$build_sha" != "$commit" || "$build_result" != "success" || "$build_name" != "AppImage Build" ]]; then
            echo "Build run $run_id does not match successful AppImage Build for $tag" >&2
            exit 1
          fi
          if [[ "$build_job_result" != "success" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
              echo "The AppImage build job was skipped; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Build run $run_id has no successful AppImage build job" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            tag="$(git tag --points-at "$commit" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "$tag" ]]; then
              base_version="$(git show "$commit:Cargo.toml" | sed -nE 's/^version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p')"
              if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Could not read a vX.Y.Z base version from Cargo.toml" >&2
                exit 1
              fi
              tag="v$base_version"
              latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
              if [[ -n "$latest" && "$(printf '%s\n' "$tag" "$latest" | sort -V | tail -n 1)" == "$latest" ]]; then
                IFS='.' read -r major minor patch <<< "${latest#v}"
                tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          date '+Release time: %Y-%m-%d %H:%M:%S %Z'
      - name: Download built AppImage
        if: steps.tag.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: AirCard-x86_64.AppImage
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.tag.outputs.run_id }}
      - name: Generate changelog
        if: steps.tag.outputs.release == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          test -s dist/AirCard-x86_64.AppImage
          previous=""
          if git rev-parse "$RELEASE_COMMIT^" >/dev/null 2>&1; then
            previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$RELEASE_COMMIT^" 2>/dev/null || true)"
          fi
          if [[ -n "$previous" ]]; then
            range="$previous..$RELEASE_COMMIT"
          else
            range="$RELEASE_COMMIT"
          fi
          {
            printf '# Changelog\n\n'
            while IFS=$'\t' read -r commit subject; do
              printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
                "${commit:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$commit" "$subject"
            done < <(git log --format='%H%x09%s' "$range")
          } > "$RUNNER_TEMP/release-notes.md"
          if [[ $(wc -l < "$RUNNER_TEMP/release-notes.md") -lt 3 ]]; then
            echo "No commits found for changelog" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        if: steps.tag.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AirCard-x86_64.AppImage --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" dist/AirCard-x86_64.AppImage \
              --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$RELEASE_COMMIT"
          fi
