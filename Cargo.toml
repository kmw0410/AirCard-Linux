[package]
name = "aircard-linux"
version = "0.1.0"
edition = "2024"
description = "GTK Linux client for AirCard"
license = "MIT"

[[bin]]
name = "aircard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
miniz_oxide = "0.8"
plist = "1"
rand = "0.9"
regex = "1"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
